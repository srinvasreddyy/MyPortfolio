<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2320"/>
      <stop offset="100%" stop-color="#1E1916"/>
    </linearGradient>
    <!-- Subtle terracotta inner glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C96541" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C96541" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: espresso rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Terracotta inner glow -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#glow)"/>

  <!-- Terracotta accent border (top edge only — editorial detail) -->
  <rect x="0" y="0" width="64" height="3" rx="1.5" fill="#C96541" opacity="0.9"/>

  <!-- Letter S — bold, editorial, matches Syne 800 weight -->
  <text
    x="32"
    y="47"
    text-anchor="middle"
    font-family="'Trebuchet MS', 'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="900"
    fill="#F4F0EA"
    letter-spacing="-2"
  >S</text>

  <!-- Terracotta dot under the S — matches site's bullet/accent motif -->
  <circle cx="32" cy="57" r="2.5" fill="#C96541"/>
</svg>

